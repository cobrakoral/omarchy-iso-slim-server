#!/usr/bin/nft -f
# Unofficial Omarchy Slim Server: default-deny inbound, IPv4 + IPv6.
# Own only our table. Do not flush other software's firewall tables.
destroy table inet omarchy_server_filter

table inet omarchy_server_filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state invalid drop
    ct state { established, related } accept

    # SSH management. Other incoming TCP/UDP ports remain closed.
    tcp dport 22 accept

    # Preserve address acquisition and renewal on both IP families.
    meta nfproto ipv4 udp sport 67 udp dport 68 accept
    meta nfproto ipv6 udp sport 547 udp dport 546 accept

    # IPv4 diagnostics and path MTU discovery.
    meta nfproto ipv4 icmp type {
      echo-request, destination-unreachable, time-exceeded, parameter-problem
    } accept

    # IPv6 PMTU, router/neighbor discovery and multicast listener discovery.
    # Blocking these breaks IPv6 SLAAC, DHCPv6 or normal link operation.
    meta nfproto ipv6 icmpv6 type {
      echo-request, destination-unreachable, packet-too-big, time-exceeded,
      parameter-problem, nd-router-solicit, nd-router-advert,
      nd-neighbor-solicit, nd-neighbor-advert,
      mld-listener-query, mld-listener-report, mld-listener-done,
      mld2-listener-report
    } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
