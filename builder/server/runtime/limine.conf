TARGET_OS_NAME="Omarchy Slim Server (unofficial)"
CUSTOM_UKI_NAME="omarchy"
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes
BOOT_ORDER="linux-omarchy, *, *fallback, Snapshots"
MAX_SNAPSHOT_ENTRIES=6
SNAPSHOT_FORMAT_CHOICE=5
KERNEL_CMDLINE[default]+=" initramfs_async=0 console=tty0 console=ttyS0,115200"
